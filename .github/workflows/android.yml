name: Android CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Policy scan
        run: |
          ! grep -RniE 'android.permission.INTERNET|WRITE_SETTINGS|firebase|analytics|auto.?click|贝利亚|赛罗' app/src README.md || exit 1
          ! find app/src/main -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print | grep . || exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: dimveil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
