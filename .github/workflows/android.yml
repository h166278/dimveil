name: Android CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_B64" | base64 -d > app/keystore/dimveil-release.jks
      - name: Unit tests, lint and APKs
        env:
          KEYSTORE_PATH: keystore/dimveil-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Policy scan
        run: |
          ! grep -RniE 'android.permission.INTERNET|WRITE_SETTINGS|firebase|analytics|auto.?click|贝利亚|赛罗' app/src README.md || exit 1
          ! find app/src/main -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print | grep . || exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: dimveil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dimveil-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
